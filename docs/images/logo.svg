<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="200" rx="16" fill="#070a10" />

  <!-- Geometric Emblem -->
  <g transform="translate(60, 36)">
    <!-- Squircle Container -->
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#0b0f17" stroke="#1e293b" stroke-width="2" />
    
    <!-- Git-native branching / traffic splitting node graph -->
    <!-- Active branch (Emerald) -->
    <path d="M 38 92 L 38 36" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <!-- Branching curve to canary -->
    <path d="M 38 64 C 38 52, 90 60, 90 44" stroke="#6366f1" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 0" />
    <!-- Shadow fork arc -->
    <path d="M 38 78 C 58 78, 86 86, 86 102" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" />

    <!-- Nodes -->
    <circle cx="38" cy="92" r="8" fill="#10b981" filter="url(#glow)" />
    <circle cx="38" cy="36" r="7" fill="#10b981" />
    <circle cx="90" cy="44" r="7" fill="#6366f1" />
    <circle cx="86" cy="102" r="6" fill="#a855f7" />
    <circle cx="38" cy="64" r="5" fill="#f59e0b" />
  </g>

  <!-- Typography Brand -->
  <g transform="translate(216, 114)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#ffffff">
      prompt<tspan fill="#6366f1">ledger</tspan>
    </text>
  </g>

  <!-- Tagline / Descriptor -->
  <g transform="translate(218, 146)">
    <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#64748b">
      GIT-NATIVE PROMPT VC • CANARY TRAFFIC ROUTER • SHADOW EVALUATOR
    </text>
  </g>

  <!-- Badge Pill -->
  <g transform="translate(565, 80)">
    <rect width="138" height="26" rx="6" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1" />
    <text x="69" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">
      SUB-2MS OVERHEAD
    </text>
  </g>
</svg>
