name: CI & Golden Benchmark Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test & Golden Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies & Build Embedded Studio
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run Go Unit & Integration Tests
        run: |
          go test -v -race ./test

      - name: Run Router Nano-Latency Benchmarks
        run: |
          go test -v -bench="BenchmarkRouter_Route" -run=^$$ ./test

      - name: Build Single-Binary promptledger Daemon
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/promptledger ./cmd/promptledger

      - name: Validate Git-Native Prompt Specifications
        run: |
          ./bin/promptledger validate ./prompts

      - name: Run Pre-Merge Golden Dataset Benchmark
        run: |
          ./bin/promptledger eval --prompt checkout-intent-classifier --dataset evals/checkout_intent_eval.jsonl
