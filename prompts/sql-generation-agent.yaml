version: "1"
prompt_id: "sql-generation-agent"
description: "Translates natural language questions into read-only PostgreSQL queries"

routing:
  strategy: "canary"
  active_version: "v1.0.0"
  variants:
    - version: "v1.0.0"
      weight: 100
  shadow:
    enabled: true
    version: "v1.1.0-shadow"
    sample_rate: 0.35

gates:
  min_quality_score: 0.92
  max_p95_latency_ms: 500
  max_error_rate: 0.005
  min_sample_size: 30
  auto_promote: false
  auto_rollback: true

versions:
  v1.0.0:
    model: "gpt-4o"
    author: "marcus@promptledger.dev"
    commit: "3a88c02"
    created_at: 2026-11-01T08:30:00Z
    template: |
      Generate a safe, read-only PostgreSQL query based on the schema and question.
      Schema:
      {{.DatabaseSchema}}
      
      User Question: {{.UserQuestion}}
      
      Respond strictly with JSON:
      {"sql": "SELECT ...;", "explanation": "..."}

  v1.1.0-shadow:
    model: "deepseek-coder-v2"
    author: "elena@promptledger.dev"
    commit: "5e2b991"
    created_at: 2026-11-13T12:00:00Z
    template: |
      You are an expert SQL engineer.
      Generate ANSI-compliant, optimized, read-only SELECT queries.
      Never use DROP, DELETE, INSERT, UPDATE, or ALTER.
      
      Schema Context:
      {{.DatabaseSchema}}
      
      Question: {{.UserQuestion}}
      
      Output JSON:
      {"sql": "SELECT ...;", "tables_referenced": ["users"], "complexity": "LOW|MED|HIGH"}
